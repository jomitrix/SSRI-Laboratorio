<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Film (TMDB)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TMDB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="popolari.html">Popolari</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Scheda Film</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link " href="utente.html">Profilo Utente</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="container-md">
            <div class="row bg-primary-subtle rounded p-md-4 p-3">
                <div class="col-md-3 p-0">
                    <img id="poster" class="img-fluid rounded"
                        src="https://image.tmdb.org/t/p/w1280">
                </div>
                <div class="col-md-9 ps-md-4">
                    <h1 class="mt-3 mt-md-0" id="title">Film</h1>
                    <div class="row">
                        <div class="col" id="release_date">1900-01-01</div>
                        <div class="col" id="generi">Generi</div>            
                    </div>
                    <div class="row mt-3">
                        <h3>Rating</h5>
                            <div class="row"><div id="rating"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-star-fill" viewBox="0 0 16 16">
                                <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
                              </svg></div></div>
                            <div class="row"><div id="votanti"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                              </svg></div></div>

                              <div id="vota" class="row">
                                <div class="col-auto">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                                      </svg>
                                </div>
                                <div class="col-auto p-0 me-1">
                                    <input type="number" class="form-control form-control-sm id="voteInput" name="vote" min="0" max="10" placeholder="0-10">
                                </div>
                                <div class="col-auto p-0">
                                    <input type="button" class="btn btn-sm btn-primary" value="Vota">
                                </div>
                            </div>
                            
                    </div>
                    <div>
                        <h3 class="mt-3">Overview</h3>
                        <p id="overview"></p>
                    </div>

                    <div class="row d-none">
                        <div class="col">
                            Bong Joon Ho
                            <br>
                            Director, Writer
                        </div>
    
                        <div class="col">
                            Edward Ashton
                            <br>
                            Novel
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="row mt-4">
                    <h3>Cast</h3>
                </div>
                <div class="row">
                    <div class="col-auto mb-3">
                        <div class="card" style="width: 11rem;">
                            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fcdn.pixabay.com%2Fphoto%2F2016%2F08%2F08%2F09%2F17%2Favatar-1577909_1280.png&f=1&nofb=1&ipt=98bf0a20eeb2ffda2080b72c640731c42a472fabd9fba37452a3895b524c4c4e&ipo=images" class="card-img-top" alt="...">
                            <div class="card-body">
                              <h5 class="card-title">Personaggio 1</h5>
                              <p class="card-text">Attore 1</p>
                            </div>
                          </div>
                    </div>

                    <div class="col-auto mb-3">
                        <div class="card" style="width: 11rem;">
                            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fcdn.pixabay.com%2Fphoto%2F2016%2F08%2F08%2F09%2F17%2Favatar-1577909_1280.png&f=1&nofb=1&ipt=98bf0a20eeb2ffda2080b72c640731c42a472fabd9fba37452a3895b524c4c4e&ipo=images" class="card-img-top" alt="...">
                            <div class="card-body">
                              <h5 class="card-title">Personaggio 2</h5>
                              <p class="card-text">Attore 2</p>
                            </div>
                          </div>
                    </div>

                    <div class="col-auto mb-3">
                        <div class="card" style="width: 11rem;">
                            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fcdn.pixabay.com%2Fphoto%2F2016%2F08%2F08%2F09%2F17%2Favatar-1577909_1280.png&f=1&nofb=1&ipt=98bf0a20eeb2ffda2080b72c640731c42a472fabd9fba37452a3895b524c4c4e&ipo=images" class="card-img-top" alt="...">
                            <div class="card-body">
                              <h5 class="card-title">Personaggio 3</h5>
                              <p class="card-text">Attore 3</p>
                            </div>
                          </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="popolari.js"></script>
    <script>
        var parametri = new URLSearchParams(window.location.search);
var id_film = parametri.get("id");
var data = popolari.results.find((el) => el.id == id_film);

document.getElementById("title").innerHTML = data.title;
document.getElementById("poster").src += data.poster_path;
document.getElementById("release_date").innerHTML = data.release_date;
document.getElementById("rating").innerHTML += " " + data.vote_average + "/10";
document.getElementById("votanti").innerHTML += " " + data.vote_count;
document.getElementById("overview").innerHTML = data.overview;
document.title = data.title + " (TMDB)";
    </script>
</body>

</html>
