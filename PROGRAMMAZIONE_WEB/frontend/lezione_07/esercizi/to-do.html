<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mt-5">
        <h1 class="text-center">To-Do List</h1>

        <form name="todo" onsubmit="return aggiungiTask();">
            <div class="row">
                <div class="col-8 col-sm-9 mb-3">
                    <input type="text" id="taskInput" class="form-control" placeholder="Aggiungi un task" required>
                </div>
                <div class="col-4 col-sm-3 mb-3">
                    <input type="submit" class="btn btn-primary w-100" value="Aggiungi">
                </div>
            </div>
        </form>        

        <div class="mt-4" id="tasks">
            <!-- Tasks aggiunti qui -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        function aggiungiTask() {
            var taskValue = document.getElementById("taskInput").value;
            if (taskValue.trim() == "") return false;

            var taskDiv = document.createElement("div");
            taskDiv.classList.add("form-check", "mb-1");

            var checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.classList.add("form-check-input");
            checkbox.id = "taskCheckbox_" + Date.now();

            var label = document.createElement("label");
            label.classList.add("form-check-label");
            label.setAttribute("for", checkbox.id);
            label.textContent = taskValue;

            taskDiv.appendChild(checkbox);
            taskDiv.appendChild(label);

            document.getElementById("tasks").appendChild(taskDiv);
            document.getElementById("taskInput").value = "";

            return false;
        }
    </script>

    </body>
</html>
