<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <form name="registrazione" action="risposta.html" method="get" onsubmit="return invioForm();">
            <div class="row mb-3">
                <div class="col"><input name="nome" class="form-control" type="text" placeholder="Nome" value="Mario">
                </div>
                <div class="col"><input name="cognome" class="form-control" type="text" placeholder="Cognome"
                        value="Rossi"></div>
            </div>
            <div class="row mb-3">
                <div class="col"> <input name="email" class="form-control" type="email" placeholder="E-mail"
                        value="mario.rossi@example.com"></div>
            </div>
            <div class="row mb-3">
                <div class="col"><input name="password" class="form-control" type="password" placeholder="Password" value="Ciao">
                </div>
                <div class="col"><input id="cpassword" class="form-control" type="password" placeholder="Password" value="Ciao"></div>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <select class="form-select">
                        <option value="">Sesso</option>
                        <option value="M">Maschio</option>
                        <option value="F">Femmina</option>
                        <option value="Altro">Altro</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <input type="submit" class="form-control" value="Invia">
                </div>
            </div>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        
        var nome = document.registrazione.nome;
        var password = document.registrazione.password;
        var cpassword = document.getElementById('cpassword');

    
        function invioForm() {
            var flag = true;
            console.log(password.value);
            console.log(cpassword.value);

            if (nome.value.length < 2 ){
                console.log("Errore");
                nome.classList.add("border-danger");
                flag = false;
                
            }else{
                console.log("OK");
                nome.classList.remove('border-danger');
                nome.classList.remove('border-success');
            }

            if (password.value != cpassword.value){
                console.log("Password Diverse");
                cpassword.classList.add('border-danger');
                flag = false;
            }else{
                cpassword.classList.remove('border-danger');
            }



            return flag;
        }
    </script>
</body>

</html>
