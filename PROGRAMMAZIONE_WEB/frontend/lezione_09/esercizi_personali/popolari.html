<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popular Movies — The Movie Database (TMDB)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

    <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB" height="18">
            </a>          
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="popolari.html">Popular</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" href="scheda-film.html" aria-disabled="true">Movie Details</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link " href="utente.html">My Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row m-3 text-center">
            <h1>Popular Movies</h1>
        </div>
        <div class="row justify-content-center">
            <div id="modello" class="col-6 col-sm-4 col-md-3 col-lg-2 g-3 d-none">
                <div class="card">
                    <img src="https://image.tmdb.org/t/p/w440_and_h660_face/" class="card-img-top" alt="...">
                    <div class="card-body">
                      <h5 class="card-title" id="titolo"></h5>
                      <p class="card-text text-secondary" id="descrizione"></p>
                      <a href="scheda-film.html?id=" id="scheda" class="btn btn-primary">Read more</a>
                    </div>
                </div>
            </div>
            
        </div>

        <div class="row justify-content-center my-4">
            <div class="col-auto">
                <button class="btn btn-secondary" onclick="showMore()">Show More</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    
    <!-- <script src="popolari.js"></script> -->
    <script>
        var page = 1;

        function addFilm() {
            fetch('https://api.themoviedb.org/3/movie/popular?language=en-US&page='+ page +'&api_key=YOUR_TMDB_API_KEY')
            .then(res => res.json())
            .then(popolari => {
                var modello = document.getElementById("modello");
        
                for (var i = 0; i < popolari.results.length; i++) {
                    var clone = modello.cloneNode(true);
                    var film = popolari.results[i];
                
                    clone.getElementsByClassName("card-title")[0].innerHTML = film.title;
                    clone.getElementsByClassName("card-text")[0].innerHTML = new Date(film.release_date).toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
                    clone.getElementsByTagName("img")[0].src += film.poster_path;
                    clone.getElementsByTagName("a")[0].href += film.id;
                    
                    clone.id = film.id;
                    clone.classList.remove('d-none');
                    modello.before(clone);
                }
            });
        }

        onload(addFilm());
        
        function showMore() {
            page++;
            addFilm();
        }
    </script>
</body>

</html>
