    <div class="container">

        </div>
        <div class="row md-3 justify-content-center">
            <div class="col-md-3 col-5">
                <div class="input-group">
                    <span class="input-group-text" id="basic-addon3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-layout-split" viewBox="0 0 16 16">
                            <path d="M0 3a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm8.5-1v12H14a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zm-1 0H2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h5.5z"/>
                          </svg>
                      </span>
                    <input id="page-sel" type="number" min="1" max="500" value="1" step="1" class="form-control" aria-describedby="basic-addon3" onchange="refresh();">
                </div>
            </div>
                        
            <div class="col-md-3 col-7">
                <div class="input-group">
                  <span class="input-group-text" id="basic-addon2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-translate" viewBox="0 0 16 16">
                        <path d="M4.545 6.714 4.11 8H3l1.862-5h1.284L8 8H6.833l-.435-1.286zm1.634-.736L5.5 3.956h-.049l-.679 2.022z"/>
                        <path d="M0 2a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v3h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-3H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zm7.138 9.995q.289.451.63.846c-.748.575-1.673 1.001-2.768 1.292.178.217.451.635.555.867 1.125-.359 2.08-.844 2.886-1.494.777.665 1.739 1.165 2.93 1.472.133-.254.414-.673.629-.89-1.125-.253-2.057-.694-2.82-1.284.681-.747 1.222-1.651 1.621-2.757H14V8h-3v1.047h.765c-.318.844-.74 1.546-1.272 2.13a6 6 0 0 1-.415-.492 2 2 0 0 1-.94.31"/>
                    </svg>
                  </span>
                  <select id="lang-sel" class="form-select" aria-describedby="basic-addon2" onchange="refresh();"></select>
                </div>
            </div>

            <div class="col-md-6 col-12 mt-2 mt-md-0">
                <div class="input-group">
                  <span class="input-group-text" id="basic-addon1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"></path>
                    </svg>

        <div id="movie-content" class="row justify-content-center mb-4 mt-2">
            <div id="modello" class="col-6 col-sm-4 col-md-3 col-lg-2 g-3 d-none">
                <div class="card">
                    <img src="https://image.tmdb.org/t/p/w440_and_h660_face/" class="card-img-top" alt="...">
                    <div class="card-body">
                      <h5 class="card-title" id="titolo"></h5>
                      <p class="card-text text-secondary" id="descrizione"></p>
                      <a href="scheda-film.html?id=" id="scheda" class="btn btn-primary">Read more</a>
                    </div>
                </div>
            </div>
            
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    
    <script src="lib.js"></script>
    <script>
        setLanguage().then(() => {
            showPopular();
        });

        let lastSearchQuery = "";

        function refresh() {
            const searchBox = document.getElementById("search-box");
            const pageSel = document.getElementById("page-sel");

            // Controlla se è cambiato da popolari a ricerca e viceversa
            if (searchBox.value !== lastSearchQuery) {
                pageSel.value = 1; // Resetta a pagina 1
            }
            lastSearchQuery = searchBox.value;  // Aggiorna l'ultima ricerca
            
            if (searchBox.value !== "") showSearchResults();
            else showPopular();
        }

        // Predisposizione ad aggiornare la lingua (utilizzando la select)
        function setLanguage(){
            return fetch(`https://api.themoviedb.org/3/configuration/languages?api_key=${api_key}`)
                .then(res => res.json())
                .then(res => getLanguage(res));
        }
        

        function getLanguage(langs) {
            var lang_select = document.getElementById("lang-sel");
            langs.sort((a, b) => a.english_name.localeCompare(b.english_name)); //ordina in alfabetico

            // Array con le lingue consigliate:
            let recommendedLangs = [
                langs.find(lang => lang.iso_639_1 === "en"), // English
                langs.find(lang => lang.iso_639_1 === "it")  // Italiano
            ];

            // combino gli array (sarà presente ripetizione voluta) (uso operatore spread)
            langs = [...recommendedLangs, ...langs];

            // Popolo la select
            lang_select.innerHTML = "";

            langs.forEach(lang => {
                lang_select.add(new Option(lang.english_name, lang.iso_639_1));
            });
            lang_select.value = "en"; // inglese come predefinito
        }


        // Riempi il box movie-content con i film popolari
        function showPopular() {
            var modello = document.getElementById("modello");
            var body = document.getElementById("movie-content");
            body.innerHTML = "";
            body.append(modello);

            var page = document.getElementById("page-sel").value;
            var lang = document.getElementById('lang-sel').value;
            fetch(`https://api.themoviedb.org/3/movie/popular?language=${lang}&page=${page}&api_key=${api_key}`)
            .then(res => res.json())
            .then(popolari => {
        
                for (var i = 0; i < popolari.results.length; i++) {
                    var clone = modello.cloneNode(true);
                    var film = popolari.results[i];
                
                    clone.getElementsByClassName("card-title")[0].innerHTML = film.title;
                    if (film.release_date) clone.getElementsByClassName("card-text")[0].innerHTML = new Date(film.release_date).toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
                    else clone.getElementsByClassName("card-text")[0].innerHTML = "No Release Date"
                    if (film.poster_path) clone.getElementsByTagName("img")[0].src += film.poster_path;
                    else clone.getElementsByTagName("img")[0].src = "https://placehold.co/440x660/d6d8db/6c757d/?text=Poster+Missing";
                    clone.getElementsByTagName("a")[0].href += `${film.id}&lang=${lang}`;
                    
                    clone.id = film.id;
                    clone.classList.remove('d-none');
                    modello.before(clone);
                }
            });
        }

        // Riempi il box movie-content con i risultati della query di ricerca
        function showSearchResults() {
            var modello = document.getElementById("modello");
            var body = document.getElementById("movie-content");
            body.innerHTML = "";
            body.append(modello);

            var page = document.getElementById("page-sel").value;
            var lang = document.getElementById('lang-sel').value;
            var query = document.getElementById('search-box').value;
            fetch(`https://api.themoviedb.org/3/search/movie?query=${query}&include_adult=false&language=${lang}&page=${page}&api_key=${api_key}`)
            .then(res => res.json())
            .then(queryResults => {
                for (var i = 0; i < queryResults.results.length; i++) {
                    var clone = modello.cloneNode(true);
                    var film = queryResults.results[i]; 
                
                    clone.getElementsByClassName("card-title")[0].innerHTML = film.title;
                    if (film.release_date) clone.getElementsByClassName("card-text")[0].innerHTML = new Date(film.release_date).toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
                    else clone.getElementsByClassName("card-text")[0].innerHTML = "No Release Date"
                    if (film.poster_path) clone.getElementsByTagName("img")[0].src += film.poster_path;
                    else clone.getElementsByTagName("img")[0].src = "https://placehold.co/440x660/d6d8db/6c757d/?text=Poster+Missing";
                    clone.getElementsByTagName("a")[0].href += `${film.id}&lang=${lang}`;
                    
                    clone.id = film.id;
                    clone.classList.remove('d-none');
                    modello.before(clone);
                }
            });
        }
    </script>
