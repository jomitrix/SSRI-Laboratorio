<head>

    <div class="container">
        <div class="alert alert-danger d-none mt-1 mb-1" id="alert" role="alert"></div>
        <div class="alert alert-success d-none mt-1 mb-1" id="success" role="alert"></div>
        
        
        <div id="form">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email_login" value="mario.rossi@email.it">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" value="casa">
            </div>

            <button class="btn btn-primary" onclick="login()">Submit</button>
            <button class="btn btn-secondary ms-2" onclick="showRegister()">Registrati</button>
        </div>

        <div id="register-form" class="d-none">
            <h3>Registrazione</h3>
            <div class="mb-3">
                <label for="reg_nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="reg_nome">
            </div>
            <div class="mb-3">
                <label for="reg_cognome" class="form-label">Cognome</label>
                <input type="text" class="form-control" id="reg_cognome">
            </div>
            <div class="mb-3">
                <label for="reg_email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="reg_email">
            </div>
            <div class="mb-3">
                <label for="reg_password" class="form-label">Password</label>
                <input type="password" class="form-control" id="reg_password">
            </div>
            <div class="mb-3">
                <label for="reg_film_preferito" class="form-label">Film Preferito</label>
                <input type="text" class="form-control" id="reg_film_preferito">
            </div>

            <button class="btn btn-success" onclick="register()">Registrati</button>
            <button class="btn btn-secondary ms-2" onclick="showLogin()">Torna al Login</button>
        </div>

        <div id="scheda" class="">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome">
            </div>
            <div class="mb-3">
                <label for="cognome" class="form-label">Cognome</label>
                <input type="text" class="form-control" id="cognome">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email">
            </div>
            <div class="mb-3">
                <label for="film_preferito" class="form-label">Film Preferito</label>
                <input type="text" class="form-control" id="film_preferito">
            </div>
            <button type="submit" class="btn btn-primary" onclick="aggiorna()">Aggiorna</button>
            <button type="submit" class="btn btn-warning" onclick="logout()">Log Out</button>
            <button type="submit" class="btn btn-danger" onclick="cancella()">Cancella L'utente</button>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
    </script>
    <script>
        function login() {
            const cEmail = document.getElementById('email_login').value;
            const cPassword = document.getElementById('password').value;
    
            const user = {
                email: cEmail,
                password: cPassword
            };
    
            const options = {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(user)
            };
    
            fetch("http://localhost:3003/user/login", options)
                .then(response => response.json())
                .then(result => checkLogin(result));
        }
    
        function isLogged() {
            var form = document.getElementById('form');
            if (localStorage.getItem('user_id')) {
                form.classList.add('d-none');
                popola_scheda();
            } else {
                var scheda = document.getElementById('scheda');
                scheda.classList.add('d-none');
                form.classList.remove('d-none');   
            }
        }
        
        function checkLogin(result) {
            var alert = document.getElementById("alert");
            if (result.error) {
                alert.innerHTML = result.error;
                alert.classList.remove('d-none');
            } else {
                localStorage.setItem('user_id', result._id);
                alert.classList.add('d-none');
                var form = document.getElementById('form');
                form.classList.add('d-none');
                popola_scheda()   
            }
        }
    
        function popola_scheda(){
            const localid = localStorage.getItem('user_id');
            fetch(`http://localhost:3003/user/${localid}`)
                    .then(response => response.json())
                    .then(result => saluta(result))
        }
    
        function saluta(result) {
            console.log(result);
            var scheda = document.getElementById('scheda');
            const cNome = document.getElementById('nome').value = result.nome;
            const cCognome = document.getElementById('cognome').value = result.cognome;
            const cEmail = document.getElementById('email').value = result.email;
            const cFilmPreferito = document.getElementById('film_preferito').value = result.film_preferito;
            scheda.classList.remove('d-none');
        }
    
        function aggiorna() {
            const user_id = localStorage.getItem('user_id');

            const nome = document.getElementById("nome").value.trim();
            const cognome = document.getElementById("cognome").value.trim();
            const email = document.getElementById("email").value.trim();
            const film_preferito =  document.getElementById("film_preferito").value.trim();

            fetch(`http://localhost:3003/user/${user_id}`, {
                method: "PATCH",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nome, cognome, email, film_preferito }),
            })
            .then(response => response.json())
            .then(data => { 
                const notify = document.getElementById(data.status === "success" ? "success" : "error");
                notify.textContent = data.message;
                notify.classList.remove("d-none");
                setTimeout(() => {
                    notify.classList.add("d-none");
                }, 5000);
            });
        }
    
        function cancella() {
            const user_id = localStorage.getItem('user_id');

            fetch(`http://localhost:3003/user/${user_id}`, {
                method: "DELETE",
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log(`Utente eliminato: ${data}`);
                logout();
            });
        }
    
        function logout(){
            localStorage.removeItem('user_id');
            isLogged(); // rieseguo la logica
            location.reload(); // oppure Ricarico la pagina
        }

        function showRegister() {
            document.getElementById('form').classList.add('d-none');
            document.getElementById('register-form').classList.remove('d-none');
        }

        function showLogin() {
            document.getElementById('register-form').classList.add('d-none');
            document.getElementById('form').classList.remove('d-none');
        }

        function register() {
            const nome = document.getElementById('reg_nome').value;
            const cognome = document.getElementById('reg_cognome').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;
            const film_preferito = document.getElementById('reg_film_preferito').value;

            const user = {
                nome: nome,
                cognome: cognome,
                email: email,
                password: password,
                film_preferito: film_preferito
            };

            const options = {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(user)
            };

            fetch("http://localhost:3003/user/register", options)
                .then(response => response.json())
                .then(result => {
                    var alert = document.getElementById("alert");
                    var success = document.getElementById("success");
                    
                    if (result.insertedId) {
                        success.innerHTML = "Registrazione completata! Ora puoi fare il login.";
                        success.classList.remove('d-none');
                        alert.classList.add('d-none');
                        showLogin();
                    } else {
                        alert.innerHTML = result.message || "Errore durante la registrazione";
                        alert.classList.remove('d-none');
                        success.classList.add('d-none');
                    }
                });
        }

        isLogged();
    </script>
</body>

</html>
